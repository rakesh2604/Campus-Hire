<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CampusHire - AI-Powered Recruitment & Placement Platform</title>
    <meta name="title" content="CampusHire - AI-Powered Recruitment & Placement Platform" />
    <meta name="description" content="Connect students with top companies. AI-powered job matching, resume optimization, interview preparation, and career guidance. Find your dream job today!" />
    <meta name="keywords" content="campus recruitment, job placement, AI recruitment, student jobs, career guidance, resume builder, interview prep, campus hiring" />
    <meta name="author" content="CampusHire" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campushire.com/" />
    <meta property="og:title" content="CampusHire - AI-Powered Recruitment & Placement Platform" />
    <meta property="og:description" content="Connect students with top companies. AI-powered job matching, resume optimization, interview preparation, and career guidance." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://campushire.com/" />
    <meta property="twitter:title" content="CampusHire - AI-Powered Recruitment & Placement Platform" />
    <meta property="twitter:description" content="Connect students with top companies. AI-powered job matching, resume optimization, interview preparation, and career guidance." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.campushire.com" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://campushire.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CampusHire",
      "description": "AI-powered recruitment and placement platform connecting students with top companies",
      "url": "https://campushire.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
  </body>
</html>
